<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shiftdeck</title>
  <meta name="description" content="Convert and edit files on your computer, without uploading them anywhere.">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Icon set: used as <svg class="icon" aria-hidden="true"><use href="#i-name"/></svg> -->
  <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
    <defs>
      <symbol id="i-merge" viewBox="0 0 24 24"><path d="M8 3v6a4 4 0 0 0 4 4 4 4 0 0 1 4 4v4M16 3v6a4 4 0 0 1-4 4M5 18l3 3 3-3"/></symbol>
      <symbol id="i-split" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="18" rx="1.5"/><rect x="13" y="3" width="8" height="18" rx="1.5"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5M9 13h6M9 17h6"/></symbol>
      <symbol id="i-convert" viewBox="0 0 24 24"><rect x="3" y="4" width="11" height="9" rx="1.5"/><path d="m3 11 3-3 3 3M17 8h4v12H9v-4"/><path d="m14 17 3 3 3-3"/></symbol>
      <symbol id="i-organize" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/><path d="M14 18h7M18 15l3 3-3 3"/></symbol>
      <symbol id="i-turn-left" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8M3 3v5h5"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
      <symbol id="i-hash" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"/></symbol>
      <symbol id="i-sign" viewBox="0 0 24 24"><path d="M3 17c3-6 5-9 6-8s-2 7 0 7 4-6 6-6-1 5 1 5 3-2 5-3M3 21h18"/></symbol>
      <symbol id="i-stamp" viewBox="0 0 24 24"><path d="M5 19 19 5M8 5h11v11"/><rect x="3" y="3" width="18" height="18" rx="2" opacity=".5"/></symbol>
      <symbol id="i-compress" viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></symbol>
      <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><rect x="2" y="5" width="14" height="14" rx="2"/><path d="m16 10 6-3v10l-6-3"/></symbol>
      <symbol id="i-document" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5"/><path d="M8 13h8M8 17h5"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h5M14 3v5h5v3"/><circle cx="16.5" cy="16.5" r="3.5"/><path d="m19 19 2.5 2.5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8M21 3v5h-5"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
      <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" class="solid"/></symbol>
    </defs>
  </svg>

  <header>
    <div>
      <h1 class="brand"><img src="logo.svg" alt="" width="34" height="34">Shiftdeck</h1>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
    <div class="lang-picker">
      <button type="button" id="languageButton" class="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="languageList">
        <img class="flag" alt=""><span class="lang-name"></span><span class="visually-hidden" data-i18n="language"></span><svg class="icon chevron" aria-hidden="true"><use href="#i-down"/></svg>
      </button>
      <ul id="languageList" class="menu" role="listbox" data-i18n-label="language" hidden></ul>
    </div>
  </header>

  <p id="engineNotice" class="notice error" role="alert" hidden></p>
  <p id="demoNotice" class="notice info demo-notice" hidden><span data-i18n="demoNotice"></span> <a href="https://github.com/azammarchi/shiftdeck#quick-start" data-i18n="demoInstallLink"></a></p>

  <main>
    <div class="tools">
      <h2 class="tools-heading" id="toolsHeading" data-i18n="toolsHeading"></h2>
      <fieldset class="tool-group">
        <legend data-i18n="groupPdf"></legend>
        <label class="tool"><input type="radio" name="tool" value="merge" checked><svg class="icon" aria-hidden="true"><use href="#i-merge"/></svg><span data-i18n="tool_merge"></span></label>
        <label class="tool"><input type="radio" name="tool" value="split"><svg class="icon" aria-hidden="true"><use href="#i-split"/></svg><span data-i18n="tool_split"></span></label>
        <label class="tool"><input type="radio" name="tool" value="organize"><svg class="icon" aria-hidden="true"><use href="#i-organize"/></svg><span data-i18n="tool_organize"></span></label>
        <label class="tool"><input type="radio" name="tool" value="compress"><svg class="icon" aria-hidden="true"><use href="#i-compress"/></svg><span data-i18n="tool_compress"></span></label>
        <label class="tool"><input type="radio" name="tool" value="ocr"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><span data-i18n="tool_ocr"></span></label>
        <label class="tool"><input type="radio" name="tool" value="page-numbers"><svg class="icon" aria-hidden="true"><use href="#i-hash"/></svg><span data-i18n="tool_page-numbers"></span></label>
        <label class="tool"><input type="radio" name="tool" value="watermark"><svg class="icon" aria-hidden="true"><use href="#i-stamp"/></svg><span data-i18n="tool_watermark"></span></label>
        <label class="tool"><input type="radio" name="tool" value="sign"><svg class="icon" aria-hidden="true"><use href="#i-sign"/></svg><span data-i18n="tool_sign"></span></label>
        <label class="tool"><input type="radio" name="tool" value="rotate"><svg class="icon" aria-hidden="true"><use href="#i-rotate"/></svg><span data-i18n="tool_rotate"></span></label>
        <label class="tool"><input type="radio" name="tool" value="protect"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg><span data-i18n="tool_protect"></span></label>
        <label class="tool"><input type="radio" name="tool" value="unlock"><svg class="icon" aria-hidden="true"><use href="#i-unlock"/></svg><span data-i18n="tool_unlock"></span></label>
      </fieldset>
      <fieldset class="tool-group">
        <legend data-i18n="groupConvert"></legend>
        <label class="tool"><input type="radio" name="tool" value="convert-images"><svg class="icon" aria-hidden="true"><use href="#i-convert"/></svg><span data-i18n="tool_convert-images"></span></label>
        <label class="tool"><input type="radio" name="tool" value="images-to-pdf"><svg class="icon" aria-hidden="true"><use href="#i-file"/></svg><span data-i18n="tool_images-to-pdf"></span></label>
        <label class="tool"><input type="radio" name="tool" value="documents-to-pdf"><svg class="icon" aria-hidden="true"><use href="#i-document"/></svg><span data-i18n="tool_documents-to-pdf"></span></label>
        <label class="tool"><input type="radio" name="tool" value="pdf-to-images"><svg class="icon" aria-hidden="true"><use href="#i-image"/></svg><span data-i18n="tool_pdf-to-images"></span></label>
        <label class="tool"><input type="radio" name="tool" value="convert-audio"><svg class="icon" aria-hidden="true"><use href="#i-audio"/></svg><span data-i18n="tool_convert-audio"></span></label>
        <label class="tool"><input type="radio" name="tool" value="convert-video"><svg class="icon" aria-hidden="true"><use href="#i-video"/></svg><span data-i18n="tool_convert-video"></span></label>
      </fieldset>
    </div>

    <section class="workspace" aria-labelledby="toolTitle">
      <h2 id="toolTitle"></h2>
      <p id="toolHint" class="muted"></p>
      <p id="missingNotice" class="notice warning" hidden></p>

      <div id="dropZone" class="dropzone">
        <svg class="icon big" aria-hidden="true"><use href="#i-upload"/></svg>
        <p><span data-i18n="dropHint"></span>
          <button type="button" id="chooseButton" class="button"><span data-i18n="chooseFiles"></span></button></p>
        <p id="acceptsHint" class="muted small"></p>
        <input type="file" id="fileInput" multiple hidden>
      </div>

      <div class="files-header">
        <h3 data-i18n="filesHeading"></h3>
        <button type="button" id="clearButton" class="link-button" hidden><span data-i18n="clearFiles"></span></button>
      </div>
      <p id="noFiles" class="muted" data-i18n="noFiles"></p>
      <ol id="fileList" class="file-list"></ol>

      <form id="optionsForm" class="options" novalidate>
        <h3 data-i18n="optionsHeading" id="optionsHeading"></h3>

        <div class="field" data-for="split">
          <label for="rangesInput" data-i18n="ranges"></label>
          <input id="rangesInput" name="ranges" type="text" inputmode="numeric" autocomplete="off" placeholder="1-3, 4, 5-8" aria-describedby="rangesHint">
          <p id="rangesHint" class="muted small" data-i18n="rangesHint"></p>
        </div>

        <div class="field" data-for="organize">
          <div class="files-header">
            <span class="field-label" id="pagesLabel" data-i18n="pagesHeading"></span>
            <button type="button" id="resetPagesButton" class="link-button" hidden><span data-i18n="resetPages"></span></button>
          </div>
          <p id="pagesHint" class="muted small" data-i18n="pagesHint"></p>
          <p id="pagesStatus" class="muted"></p>
          <ol id="pageGrid" class="page-grid" aria-labelledby="pagesLabel"></ol>
        </div>

        <div class="field" data-for="pdf-to-images">
          <label for="formatSelect" data-i18n="format"></label>
          <select id="formatSelect" name="format">
            <option value="png">PNG</option>
            <option value="jpeg">JPEG</option>
          </select>
        </div>
        <div class="field" data-for="pdf-to-images">
          <label for="dpiInput" data-i18n="dpi"></label>
          <input id="dpiInput" name="dpi" type="number" min="36" max="600" step="1" value="150" aria-describedby="dpiHint">
          <p id="dpiHint" class="muted small" data-i18n="dpiHint"></p>
        </div>

        <div class="field" data-for="images-to-pdf">
          <label for="pageSizeSelect" data-i18n="pageSize"></label>
          <select id="pageSizeSelect" name="pageSize">
            <option value="a4" data-i18n="pageA4"></option>
            <option value="letter" data-i18n="pageLetter"></option>
            <option value="original" data-i18n="pageOriginal"></option>
          </select>
        </div>

        <div class="field" data-for="convert-images">
          <label for="imageFormatSelect" data-i18n="convertTo"></label>
          <select id="imageFormatSelect" name="format">
            <option value="jpeg">JPEG</option>
            <option value="png">PNG</option>
            <option value="webp">WebP</option>
            <option value="heic">HEIC</option>
            <option value="tiff">TIFF</option>
          </select>
          <p id="formatsHint" class="muted small" hidden></p>
        </div>
        <div class="field" data-for="convert-images" id="qualityField">
          <label for="qualityInput" data-i18n="quality"></label>
          <input id="qualityInput" name="quality" type="number" min="1" max="100" step="1" value="85" aria-describedby="qualityHint">
          <p id="qualityHint" class="muted small" data-i18n="qualityHint"></p>
        </div>
        <div class="field" data-for="convert-images">
          <label for="maxSizeInput" data-i18n="maxSize"></label>
          <input id="maxSizeInput" name="maxSize" type="number" min="16" max="30000" step="1" aria-describedby="maxSizeHint">
          <p id="maxSizeHint" class="muted small" data-i18n="maxSizeHint"></p>
        </div>
        <div class="field" data-for="convert-images" id="stripMetadataField">
          <label class="checkbox"><input type="checkbox" id="stripMetadataInput" name="stripMetadata" checked aria-describedby="stripMetadataHint"><span data-i18n="stripMetadata"></span></label>
          <p id="stripMetadataHint" class="muted small" data-i18n="stripMetadataHint"></p>
        </div>

        <div class="field" data-for="page-numbers">
          <label for="numberFormatSelect" data-i18n="numberFormat"></label>
          <select id="numberFormatSelect" name="template"></select>
        </div>
        <div class="field" data-for="page-numbers">
          <label for="numberPositionSelect" data-i18n="position"></label>
          <select id="numberPositionSelect" name="position">
            <option value="bottom-center" data-i18n="pos_bottom-center"></option>
            <option value="bottom-right" data-i18n="pos_bottom-right"></option>
            <option value="bottom-left" data-i18n="pos_bottom-left"></option>
            <option value="top-center" data-i18n="pos_top-center"></option>
            <option value="top-right" data-i18n="pos_top-right"></option>
            <option value="top-left" data-i18n="pos_top-left"></option>
          </select>
        </div>
        <div class="field" data-for="page-numbers">
          <label for="numberStartInput" data-i18n="numberStart"></label>
          <input id="numberStartInput" name="start" type="number" min="0" max="100000" step="1" value="1">
        </div>
        <div class="field" data-for="page-numbers">
          <label for="numberSizeInput" data-i18n="textSize"></label>
          <input id="numberSizeInput" name="size" type="number" min="6" max="48" step="1" value="11">
        </div>
        <div class="field" data-for="page-numbers">
          <label class="checkbox"><input type="checkbox" id="skipFirstInput" name="skipFirst"><span data-i18n="skipFirst"></span></label>
        </div>

        <div class="field" data-for="sign">
          <div class="files-header">
            <span class="field-label" id="signatureLabel" data-i18n="signatureLabel"></span>
            <button type="button" id="clearSignatureButton" class="link-button"><span data-i18n="signatureClear"></span></button>
          </div>
          <canvas id="signaturePad" class="signature-pad" role="img" aria-labelledby="signatureLabel" aria-describedby="signatureHint"></canvas>
          <p id="signatureHint" class="muted small" data-i18n="signatureHint"></p>
          <label for="typedNameInput" data-i18n="typeName"></label>
          <input id="typedNameInput" type="text" autocomplete="name" maxlength="60">
        </div>
        <div class="field" data-for="sign">
          <label for="signPageInput" data-i18n="signPage"></label>
          <input id="signPageInput" name="page" type="number" min="1" step="1" aria-describedby="signPageHint">
          <p id="signPageHint" class="muted small" data-i18n="signPageHint"></p>
        </div>
        <div class="field" data-for="sign">
          <label for="signPositionSelect" data-i18n="position"></label>
          <select id="signPositionSelect" name="position">
            <option value="bottom-right" data-i18n="pos_bottom-right"></option>
            <option value="bottom-center" data-i18n="pos_bottom-center"></option>
            <option value="bottom-left" data-i18n="pos_bottom-left"></option>
            <option value="top-right" data-i18n="pos_top-right"></option>
            <option value="top-center" data-i18n="pos_top-center"></option>
            <option value="top-left" data-i18n="pos_top-left"></option>
          </select>
        </div>
        <div class="field" data-for="sign">
          <label for="signWidthInput" data-i18n="signWidth"></label>
          <input id="signWidthInput" name="width" type="number" min="40" max="500" step="1" value="150" aria-describedby="signWidthHint">
          <p id="signWidthHint" class="muted small" data-i18n="signWidthHint"></p>
        </div>

        <div class="field" data-for="watermark">
          <label for="watermarkTextInput" data-i18n="watermarkText"></label>
          <input id="watermarkTextInput" name="text" type="text" maxlength="60" autocomplete="off">
        </div>
        <div class="field" data-for="watermark">
          <label for="watermarkStyleSelect" data-i18n="watermarkStyle"></label>
          <select id="watermarkStyleSelect" name="style">
            <option value="diagonal" data-i18n="styleDiagonal"></option>
            <option value="horizontal" data-i18n="styleHorizontal"></option>
          </select>
        </div>
        <div class="field" data-for="watermark">
          <label for="watermarkOpacityInput" data-i18n="opacity"></label>
          <input id="watermarkOpacityInput" name="opacity" type="number" min="5" max="100" step="5" value="20" aria-describedby="opacityHint">
          <p id="opacityHint" class="muted small" data-i18n="opacityHint"></p>
        </div>

        <div class="field" data-for="compress">
          <label for="compressLevelSelect" data-i18n="compressLevel"></label>
          <select id="compressLevelSelect" name="level" aria-describedby="compressLevelHint">
            <option value="smaller" data-i18n="levelSmaller"></option>
            <option value="smallest" data-i18n="levelSmallest"></option>
            <option value="lossless" data-i18n="levelLossless"></option>
          </select>
          <p id="compressLevelHint" class="muted small" data-i18n="compressHint"></p>
        </div>

        <div class="field" data-for="ocr">
          <label for="ocrOutputSelect" data-i18n="ocrOutput"></label>
          <select id="ocrOutputSelect" name="output">
            <option value="pdf" data-i18n="ocrOutputPdf"></option>
            <option value="text" data-i18n="ocrOutputText"></option>
          </select>
        </div>
        <fieldset class="field checkbox-group" data-for="ocr" aria-describedby="ocrLanguagesHint">
          <legend data-i18n="ocrLanguages"></legend>
          <div id="ocrLanguages" class="checkbox-grid"></div>
          <p id="ocrLanguagesHint" class="muted small" data-i18n="ocrLanguagesHint"></p>
        </fieldset>

        <div class="field" data-for="convert-audio">
          <label for="audioFormatSelect" data-i18n="convertTo"></label>
          <select id="audioFormatSelect" name="format">
            <option value="mp3">MP3</option>
            <option value="m4a">M4A (AAC)</option>
            <option value="ogg">OGG (Vorbis)</option>
            <option value="opus">Opus</option>
            <option value="flac">FLAC</option>
            <option value="wav">WAV</option>
          </select>
          <p id="audioFormatsHint" class="muted small" hidden></p>
        </div>
        <div class="field" data-for="convert-audio" id="bitrateField">
          <label for="bitrateSelect" data-i18n="bitrate"></label>
          <select id="bitrateSelect" name="bitrate" aria-describedby="bitrateHint">
            <option value="96">96 kbit/s</option>
            <option value="128">128 kbit/s</option>
            <option value="160">160 kbit/s</option>
            <option value="192">192 kbit/s</option>
            <option value="256">256 kbit/s</option>
            <option value="320">320 kbit/s</option>
          </select>
          <p id="bitrateHint" class="muted small" data-i18n="bitrateHint"></p>
        </div>

        <div class="field" data-for="convert-video">
          <label for="videoFormatSelect" data-i18n="convertTo"></label>
          <select id="videoFormatSelect" name="format">
            <option value="mp4">MP4 (H.264)</option>
            <option value="webm">WebM (VP9)</option>
            <option value="mov">MOV (H.264)</option>
            <option value="gif">GIF</option>
          </select>
          <p id="videoFormatsHint" class="muted small" hidden></p>
        </div>
        <div class="field" data-for="convert-video">
          <label for="videoQualitySelect" data-i18n="videoQuality"></label>
          <select id="videoQualitySelect" name="quality">
            <option value="high" data-i18n="qualityHigh"></option>
            <option value="medium" data-i18n="qualityMedium"></option>
            <option value="small" data-i18n="qualitySmall"></option>
          </select>
        </div>
        <div class="field" data-for="convert-video">
          <label for="videoHeightSelect" data-i18n="videoHeight"></label>
          <select id="videoHeightSelect" name="height">
            <option value="keep" data-i18n="heightKeep"></option>
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
            <option value="360">360p</option>
          </select>
        </div>
        <div class="field" data-for="convert-video" id="removeAudioField">
          <label class="checkbox"><input type="checkbox" id="removeAudioInput" name="removeAudio"><span data-i18n="removeAudio"></span></label>
        </div>

        <div class="field" data-for="rotate">
          <label for="degreesSelect" data-i18n="degrees"></label>
          <select id="degreesSelect" name="degrees">
            <option value="90" data-i18n="deg90"></option>
            <option value="180" data-i18n="deg180"></option>
            <option value="270" data-i18n="deg270"></option>
          </select>
        </div>

        <div class="field" data-for="protect unlock">
          <label for="passwordInput" data-i18n="password"></label>
          <input id="passwordInput" name="password" type="password" autocomplete="new-password">
          <label class="checkbox"><input type="checkbox" id="showPassword"><span data-i18n="showPassword"></span></label>
        </div>
        <p class="notice warning" id="weakNotice" data-for="protect" data-i18n="weakEncryptionNotice" hidden></p>
        <p class="notice info" id="strongNotice" data-for="protect" data-i18n="strongEncryptionNotice" hidden></p>

        <button type="submit" id="runButton" class="button primary" disabled>
          <svg class="icon" aria-hidden="true"><use href="#i-play"/></svg><span id="runLabel" data-i18n="run"></span>
        </button>
      </form>

      <div id="progressRow" class="progress-row" hidden>
        <progress id="progressBar" max="1" aria-labelledby="progressLabel"></progress>
        <span id="progressLabel" class="visually-hidden" data-i18n="progressLabel"></span>
        <button type="button" id="cancelButton" class="button"><span data-i18n="cancel"></span></button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section id="results" class="results" aria-labelledby="resultsHeading" hidden>
        <div class="files-header">
          <h3 id="resultsHeading" data-i18n="resultsHeading"></h3>
          <a id="downloadAllLink" class="button" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg><span data-i18n="downloadAll"></span>
          </a>
        </div>
        <ul id="resultList" class="file-list"></ul>
      </section>
    </section>
  </main>

  <footer data-i18n="footer"></footer>

  <script src="i18n.js"></script>
  <script src="demo.js"></script>
  <script src="app.js"></script>
</body>
</html>
