<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-label="Shiftdeck: convert and edit files on your computer, on macOS, Linux and Windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e2b"/>
      <stop offset="1" stop-color="#101219"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6c8cff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#6c8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-teal" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2ec4a6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2ec4a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f45"/>
      <stop offset="1" stop-color="#15171f"/>
    </linearGradient>
    <linearGradient id="track" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1280" y2="0">
      <stop offset="0" stop-color="#6c8cff" stop-opacity="0"/>
      <stop offset=".3" stop-color="#6c8cff"/>
      <stop offset=".6" stop-color="#2ec4a6"/>
      <stop offset="1" stop-color="#f5b942" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="400"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">

  <rect width="1280" height="400" fill="url(#bg)"/>
  <circle cx="230" cy="170" r="260" fill="url(#glow-blue)"/>
  <circle cx="1080" cy="240" r="280" fill="url(#glow-teal)"/>

  <!-- pages travelling along the bottom, changing colour as they go -->
  <path d="M0 362 H1280" stroke="url(#track)" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <g opacity=".75">
    <g transform="translate(330 330)"><path d="M3 0h12l7 7v22a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3V3a3 3 0 0 1 3-3z" fill="#6c8cff"/><path d="M15 0v7h7" fill="none" stroke="#14161f" stroke-width="2" stroke-linejoin="round"/></g>
    <g transform="translate(500 330)"><path d="M3 0h12l7 7v22a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3V3a3 3 0 0 1 3-3z" fill="#6c8cff"/><path d="M15 0v7h7" fill="none" stroke="#14161f" stroke-width="2" stroke-linejoin="round"/></g>
    <g transform="translate(670 330)"><path d="M3 0h12l7 7v22a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3V3a3 3 0 0 1 3-3z" fill="#4fa8d3"/><path d="M15 0v7h7" fill="none" stroke="#14161f" stroke-width="2" stroke-linejoin="round"/></g>
    <g transform="translate(840 330)"><path d="M3 0h12l7 7v22a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3V3a3 3 0 0 1 3-3z" fill="#2ec4a6"/><path d="M15 0v7h7" fill="none" stroke="#14161f" stroke-width="2" stroke-linejoin="round"/></g>
    <g transform="translate(1010 330)"><path d="M3 0h12l7 7v22a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3V3a3 3 0 0 1 3-3z" fill="#2ec4a6"/><path d="M15 0v7h7" fill="none" stroke="#14161f" stroke-width="2" stroke-linejoin="round"/></g>
  </g>

  <!-- logo -->
  <g transform="translate(96 74) scale(1.4)">
    <rect width="128" height="128" rx="30" fill="url(#tile)"/>
    <rect x="1.5" y="1.5" width="125" height="125" rx="28.5" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="3"/>
    <path d="M23 50h22l11 11v41a4 4 0 0 1-4 4H23a4 4 0 0 1-4-4V54a4 4 0 0 1 4-4z" fill="#6c8cff"/>
    <path d="M45 50v11h11" fill="none" stroke="#2a2f45" stroke-width="3" stroke-linejoin="round"/>
    <path d="M83 50h22l11 11v41a4 4 0 0 1-4 4H83a4 4 0 0 1-4-4V54a4 4 0 0 1 4-4z" fill="#2ec4a6"/>
    <path d="M105 50v11h11" fill="none" stroke="#2a2f45" stroke-width="3" stroke-linejoin="round"/>
    <path d="M37.5 41C37.5 17 97.5 17 97.5 39" fill="none" stroke="#f5b942" stroke-width="6" stroke-linecap="round"/>
    <path d="M88.5 32.5 97.5 41.5 106.5 32.5" fill="none" stroke="#f5b942" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="320" y="190" fill="#e8eaf0" font-family="Inter, 'SF Pro Display', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-3">Shiftdeck</text>
  <text x="324" y="248" fill="#8a90a2" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="500">Convert files. Nothing leaves your computer.</text>

  <!-- the three systems it runs on -->
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#c9cdd8" text-anchor="middle">
    <rect x="324" y="272" width="96" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/>
    <text x="372" y="295">macOS</text>
    <rect x="432" y="272" width="84" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/>
    <text x="474" y="295">Linux</text>
    <rect x="528" y="272" width="110" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/>
    <text x="583" y="295">Windows</text>
  </g>

  <!-- a HEIC photo becoming a PDF -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">
    <g transform="translate(960 120)">
      <path d="M12 0h70l26 26v118a12 12 0 0 1-12 12H12a12 12 0 0 1-12-12V12A12 12 0 0 1 12 0z" fill="#6c8cff"/>
      <path d="M82 0v26h26" fill="none" stroke="#1b1e2b" stroke-width="5" stroke-linejoin="round"/>
      <rect x="18" y="104" width="72" height="32" rx="8" fill="#000" fill-opacity=".28"/>
      <text x="54" y="127" fill="#fff">HEIC</text>
    </g>
    <g transform="translate(1124 120)">
      <path d="M12 0h70l26 26v118a12 12 0 0 1-12 12H12a12 12 0 0 1-12-12V12A12 12 0 0 1 12 0z" fill="#2ec4a6"/>
      <path d="M82 0v26h26" fill="none" stroke="#1b1e2b" stroke-width="5" stroke-linejoin="round"/>
      <rect x="18" y="104" width="72" height="32" rx="8" fill="#000" fill-opacity=".28"/>
      <text x="54" y="127" fill="#fff">PDF</text>
    </g>
  </g>
  <path d="M1014 104C1014 52 1178 52 1178 100" fill="none" stroke="#f5b942" stroke-width="8" stroke-linecap="round"/>
  <path d="M1166 90 1178 102 1190 90" fill="none" stroke="#f5b942" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
