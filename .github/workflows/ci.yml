# Runs the engine tests and the end-to-end tests on macOS, Linux and Windows,
# on every push and pull request. Each machine installs its engines with
# `npm run setup`, so the installer is tested too. On macOS `--all` also
# installs the cross-platform engines, so both engine sets are tested there.
# When the tests pass on main, the online demo (public/, see demo.js) is
# published to GitHub Pages.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # A fixed image: jobs on macos-latest waited for a runner for hours.
          - name: macOS
            os: macos-15
            setup: npm run setup -- --all
            browsers: ~/Library/Caches/ms-playwright
            install-browsers: npx playwright install webkit firefox chromium
          - name: Linux
            os: ubuntu-latest
            setup: npm run setup
            browsers: ~/.cache/ms-playwright
            install-browsers: npx playwright install --with-deps webkit firefox chromium
          - name: Windows
            os: windows-latest
            setup: npm run setup
            browsers: ~\AppData\Local\ms-playwright
            install-browsers: npx playwright install webkit firefox chromium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Install engines
        run: ${{ matrix.setup }}
      - name: Engine tests
        run: npm run test:engines
      # The browsers are cached between runs, keyed by the Playwright version in
      # the lock file.
      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.browsers }}
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: ${{ matrix.install-browsers }}
        timeout-minutes: 10
      - name: Install browser system libraries
        if: runner.os == 'Linux' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit firefox chromium
        timeout-minutes: 5
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    name: Deploy demo
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
